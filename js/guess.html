<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT FORM</title>
</head>

<body>
    <h1>STUDENT FORM</h1>

    <div>
        <table border="2">
            <tr>
                <td><strong>Name</strong></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>
                    <strong>Age</strong>
                </td>
                <td><input type="text">
                </td>
            </tr>
            <tr>
                <td><strong>Gender</strong></td>
                <td> <input type="radio" value="male">Male
                    <input type="radio" value="female">Female
                </td>
            </tr>

            <tr>
                <td>
                    <strong>Course</strong>
                </td>
                <td>
                    <select style="display: inline;">
                        <option>CSS</option>
                        <option>html</option>
                        <option>Js</option>
                    </select>

                </td>

            </tr>
            <tr>
                <td>
                    <strong>E-mail</strong>
                </td>
                <td>
                    <input type="email">
                </td>

            </tr>
            <tr>
                <th colspan="2">save</th>
            </tr>
        </table>
    </div>
    <table>
        <tr>
            <td><strong>NAME</strong></td>
            <td><strong>AGE</strong></td>
            <td><strong>COURSE</strong></td>
            <td>
                <strong>GENDER</strong>
            </td>

            <td>
                <strong>E-mail</strong>
            </td>
            <td><strong>ACTION</strong></td>
        </tr> 
    </table>



    <style>
        body {
            text-align: center;
        }

        table {

            display: inline-flex;
            padding: 8px;
        }

        tr {
            border: 10px, rgb(16, 2, 2), solid;
            margin: 10px;

        }
    </style>


</body>

</html>
